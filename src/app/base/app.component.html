<nav class="main-nav blue large-padding light-text">
    <a routerLink="/" class="nav-brand">
        <i class="fa fa-tasks"></i> <span class="nav-title"> ¿Qué hacer?</span>
    </a>
    <div class="nav-links float-right">
        <a routerLink="/">
            <i class="small-font fa fa-home"></i> <span>Inicio</span>
        </a>

        <!-- Opción Mis Listas & Dashboard -->
        <a routerLink="/dashboard">
            <i class="small-font fa fa-list-alt"></i> <span>Mis Listas</span>
        </a>

        <!-- Login / Registro / Logout -->
        <ng-container *ngIf="afAuth.authState | async as user; else loggedOut">
            <a routerLink="/profile">
                <i class="small-font fa fa-user"></i> <span>Mi perfil</span>
            </a>
            <a (click)="logout()">
                <i class="small-font fa fa-sign-out"></i> <span>Cerrar Sesión</span>
            </a>
        </ng-container>

        <ng-template #loggedOut>
            <a routerLink="/login">
                <i class="small-font fa fa-sign-in"></i> <span>Login</span>
            </a>
            <a routerLink="/register">
                <i class="small-font fa fa-user-plus"></i> <span>Registro</span>
            </a>
        </ng-template>
    </div>
</nav>

<div class="router-container">
    <router-outlet></router-outlet>
</div>
